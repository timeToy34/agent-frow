# Agent F-Row. The workspace is the repository.
[workspace]
resolver = "3"
members = ["app", "hook"]

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false
license = "MIT"
authors = ['Jerome Rota "timeToy"']
repository = "https://github.com/timeToy34/agent-frow"
readme = "README.md"

[workspace.dependencies]
# `preserve_order` matters: we rewrite the user's own settings file, and
# without it serde reorders every key alphabetically. Their file should come
# back looking like their file.
serde_json = { version = "1", features = ["preserve_order"] }

# The window. `glow` rather than the default `wgpu`: one less graphics stack to
# be surprised by on someone else's machine, and nothing here draws anything a
# 2005 GPU would struggle with.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
# The tray. Same crate Tauri itself uses for this, without the rest of Tauri.
tray-icon = { version = "0.24", default-features = false }

# What ships. Small and self-contained: LTO and a stripped binary, and the
# MSVC C runtime linked statically (see .cargo/config.toml) so the zip works
# on a machine with no redistributables installed.
[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace.lints.clippy]
# No panicking in paths that run while an agent is waiting on us. Tests opt out
# where a failure is the assertion.
unwrap_used = "warn"
expect_used = "warn"
